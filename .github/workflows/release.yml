name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build tick binary
        run: |
          set -euo pipefail
          cd lambda
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o tick_linux_arm64 -tags lambda.norpc .
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          go_build_options: -ldflags=-X=github.com/TigranOhanyan/gh-gcf/commands/bind.Version=${{ github.ref_name }}
      - name: Upload tick binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" lambda/tick_linux_arm64 --clobber
