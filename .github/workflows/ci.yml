name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start WireMock
        run: make test-up && make test-setup
      - name: Test
        run: make test-run
      - name: Build
        run: go build -o "$RUNNER_TEMP/gh-gcf" .
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
