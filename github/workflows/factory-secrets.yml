# Secrets. Bind copies this file to .github/workflows/factory-secrets.yml
# in the factory repo. A push to main creates the empty secrets.
# The values are set in Secrets Manager. This workflow does not write them.
# STACK_NAME is the Actions variable the tick stack uses. The secrets stack
# is that name with -secrets appended.

name: Factory Secrets

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy secrets
        run: |
          set -euo pipefail
          sam deploy \
            --template-file secrets.yaml \
            --stack-name "${{ vars.STACK_NAME }}-secrets" \
            --s3-bucket "${{ secrets.AWS_APPLICATION_BUCKET }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
