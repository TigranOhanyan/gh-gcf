# Scheduled tick. Bind copies this file to .github/workflows/factory-tick.yml
# in the factory repo. Actions runs it there.
#
# GH_GCF_VERSION is the pin passed to `gh extension install --pin`.
# Bind replaces __GCF_VERSION__ with the release tag of the binary that runs it.
# The tick checks out main and state, sets the Actions bot as the git author, installs gh-gcf, records a tick, runs app, runs label, compiles each development, starts and checks each agent, and pushes state.
# The runner has no git author. The bot is github-actions[bot], the account GITHUB_TOKEN pushes as.
# CURSOR_API_KEY is available for later steps. It is never printed.
# FACTORY_GITHUB_APP_ID and FACTORY_GITHUB_APP_PRIVATE_KEY let the label step mint an installation token.
# Bind replaces __APP_KEYS__ with one GITHUB_APP_<app id> line per file in apps/.
# GH_TOKEN stays the Actions token, used to install gh-gcf and push state.

name: Factory Tick

env:
  GH_GCF_VERSION: __GCF_VERSION__

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: factory-tick
  cancel-in-progress: false

jobs:
  tick:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      FACTORY_GITHUB_APP_ID: ${{ secrets.FACTORY_GITHUB_APP_ID }}
      FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
      __APP_KEYS__

    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tick
        run: |
          set -euo pipefail

          git checkout -B main
          git fetch origin state:refs/heads/state

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Installing gh-gcf ${GH_GCF_VERSION}."
          gh extension install TigranOhanyan/gh-gcf --pin "${GH_GCF_VERSION}"

          tick_id="$(gh gcf run tick)"
          echo "Tick ${tick_id}."

          gh gcf compile app --tick "${tick_id}"
          gh gcf compile label --tick "${tick_id}"
          gh gcf compile development --tick "${tick_id}"
          gh gcf run builder --tick "${tick_id}"
          gh gcf check builder --tick "${tick_id}"
          gh gcf run standards-reviewer --tick "${tick_id}"
          gh gcf check standards-reviewer --tick "${tick_id}"
          gh gcf run specification-reviewer --tick "${tick_id}"
          gh gcf check specification-reviewer --tick "${tick_id}"
          gh gcf run fixer --tick "${tick_id}"
          gh gcf check fixer --tick "${tick_id}"

          git push origin state
