AWSTemplateFormatVersion: "2010-09-09"
Description: Factory secrets

Resources:
  CursorApiKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${AWS::StackName}/cursor-api-key"
      Description: Cursor API key

  FactoryAppId:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${AWS::StackName}/factory-app-id"
      Description: Factory GitHub App ID

  FactoryAppPrivateKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${AWS::StackName}/factory-app-private-key"
      Description: Factory GitHub App private key

  __APP_SECRETS__

Outputs:
  SecretPrefix:
    Description: Name prefix of the factory secrets
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-prefix"
